name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle ставится отдельно (wrapper jar в репозитории отсутствует)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      # Подпись release: если заданы секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD — используем их (стабильная подпись, обновления
      # ставятся поверх). Иначе генерируем одноразовый ключ.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # убираем пробелы, \r и переводы строк — частая ошибка при вставке секретов
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS"
            PW="$(printf %s "$KEYSTORE_PASSWORD_SECRET" | tr -d '\r\n')"
            ALIAS="$(printf %s "$KEY_ALIAS_SECRET" | tr -d '\r\n')"
            KPW="$(printf %s "$KEY_PASSWORD_SECRET" | tr -d '\r\n')"
          else
            echo "::warning::Секреты подписи не заданы — APK подписан одноразовым ключом, поверх прошлой сборки НЕ установится (см. CHANGELOG.md)"
            PW="$(openssl rand -hex 16)"; ALIAS="igramotey"; KPW="$PW"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$KPW" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=iGramotey"
          fi
          echo "::add-mask::$PW"; echo "::add-mask::$KPW"
          # Проверяем ключ сразу, чтобы ошибка в секретах была понятной
          if ! keytool -list -keystore "$KS" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Не удалось открыть keystore: проверьте секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD и KEY_ALIAS"
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPW"
          } >> "$GITHUB_ENV"

      # versionCode растёт с номером запуска — каждая новая сборка новее предыдущей
      - name: Set version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: igramotey-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: igramotey-release-apk
          path: app/build/outputs/apk/release/*.apk
